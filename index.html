<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track the performance of your stock portfolio." />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Portfolio" />
    <title>Portfolio Tracker</title>
    <script>
      // Apply the saved theme before first paint (same logic as src/hooks/useTheme.ts).
      ;(function () {
        try {
          var t = localStorage.getItem('portfolio-tracker:theme') || 'system'
          var dark =
            t === 'dark' || t === 'black' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          var c = document.documentElement.classList
          if (dark) c.add('dark')
          if (t === 'black') c.add('black')
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
